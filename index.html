
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>Pyrmont Weather — BOM</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      border-bottom: 3px solid #000;
      padding-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 32px);
    }

    #date {
      font-size: 14px;
      text-align: right;
    }

    .current {
      padding: 24px 0;
      border-bottom: 2px solid #000;
    }

    .label {
      font-size: 14px;
      font-weight: bold;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    #temperature {
      margin: 14px 0;
      font-size: clamp(80px, 17vw, 140px);
      font-weight: bold;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    #description {
      font-size: clamp(22px, 4vw, 30px);
      font-weight: bold;
    }

    #feels {
      margin-top: 12px;
      font-size: 18px;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px 16px;
      padding: 24px 0;
      border-bottom: 2px solid #000;
    }

    .detail-label {
      margin-bottom: 10px;
      font-size: 13px;
      text-transform: uppercase;
    }

    .detail-value {
      font-size: clamp(19px, 3vw, 28px);
      font-weight: bold;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-top: 18px;
      font-size: 13px;
    }

    #status {
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    button {
      flex-shrink: 0;
      min-height: 48px;
      padding: 12px 16px;
      border: 2px solid #000;
      border-radius: 0;
      background: #fff;
      color: #000;
      font-size: 15px;
      font-weight: bold;
    }

    button:disabled { opacity: .6; }

    @media (max-width: 420px) {
      body { padding: 16px; }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      #date { text-align: left; }

      footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (orientation: landscape) and (min-width: 600px) {
      body { padding: 20px 28px; }

      main {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        column-gap: 28px;
        align-items: start;
      }

      header, footer { grid-column: 1 / -1; }

      .current {
        align-self: stretch;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
    }
  </style>
</head>

<body>
<main>
  <header>
    <h1>Pyrmont Weather</h1>
    <div id="date">Waiting for observations</div>
  </header>

  <section class="current">
    <div class="label">Current temperature</div>
    <div id="temperature">--°C</div>
    <div id="description">Loading BOM observations...</div>
    <div id="feels">Feels like --°C</div>
  </section>

  <section class="details">
    <div>
      <div class="detail-label">Humidity</div>
      <div class="detail-value" id="humidity">--%</div>
    </div>

    <div>
      <div class="detail-label">Wind</div>
      <div class="detail-value" id="wind">--</div>
    </div>

    <div>
      <div class="detail-label">Rain since 9 am</div>
      <div class="detail-value" id="rain">-- mm</div>
    </div>
  </section>

  <footer>
    <div id="status" role="status" aria-live="polite">
      Connecting to BOM...
    </div>
    <button id="refreshButton" type="button">Refresh</button>
  </footer>
</main>

<script>
  const BOM_URL =
    "https://www.bom.gov.au/fwo/IDN60801/IDN60801.94768.json";

  const CACHE_KEY = "pyrmont-bom-weather-v1";
  const REFRESH_INTERVAL = 15 * 60 * 1000;

  let loading = false;
  let lastUpdated = null;
  let lastObservation = null;
  let lastError = false;

  const $ = id => document.getElementById(id);

  function valid(value) {
    return value !== null &&
      value !== undefined &&
      value !== "" &&
      value !== "-";
  }

  function showValue(value, unit = "") {
    return valid(value) ? `${value}${unit}` : "—";
  }

  function formatDateTime(value) {
    if (!value) return "Time unavailable";

    // BOM commonly supplies DD/MM/YYYY HH:mm:ss.
    const match = String(value).match(
      /^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/
    );

    if (match) {
      const [, day, month, year, hour, minute] = match;

      const date = new Date(
        Number(year), Number(month) - 1, Number(day),
        Number(hour), Number(minute)
      );

      return date.toLocaleString("en-AU", {
        weekday: "short",
        day: "numeric",
        month: "short",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    return value;
  }

  function displayObservation(observation) {
    $("temperature").textContent =
      showValue(observation.air_temp, "°C");

    $("feels").textContent =
      `Feels like ${showValue(observation.apparent_t, "°C")}`;

    $("humidity").textContent =
      showValue(observation.rel_hum, "%");

    const direction = valid(observation.wind_dir)
      ? observation.wind_dir
      : "";

    const speed = valid(observation.wind_spd_kmh)
      ? `${observation.wind_spd_kmh} km/h`
      : "";

    $("wind").textContent =
      [direction, speed].filter(Boolean).join(" ") || "—";

    $("rain").textContent =
      showValue(observation.rain_trace, " mm");

    $("description").textContent =
      valid(observation.weather)
        ? observation.weather
        : "Station observations";

    $("date").textContent =
      formatDateTime(observation.local_date_time);
  }

  function saveCache(data) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify(data));
    } catch (error) {
      console.warn("Could not save weather cache", error);
    }
  }

  function readCache() {
    try {
      const saved = localStorage.getItem(CACHE_KEY);
      if (!saved) return null;

      const data = JSON.parse(saved);

      if (!data.observation || !data.savedAt) return null;

      return data;
    } catch {
      return null;
    }
  }

  function updateStatus() {
    if (!lastUpdated) {
      $("status").textContent = lastError
        ? "BOM unavailable. Waiting to retry."
        : "Waiting for observations...";
      return;
    }

    const time = new Date(lastUpdated).toLocaleTimeString(
      "en-AU",
      { hour: "2-digit", minute: "2-digit" }
    );

    const age = Date.now() - lastUpdated;

    let label = `Last fetched ${time}`;

    if (age > 2 * 60 * 60 * 1000) {
      label = `STALE DATA · ${label}`;
    }

    if (!navigator.onLine) {
      $("status").textContent = `OFFLINE · ${label}`;
    } else if (lastError) {
      $("status").textContent =
        `UPDATE FAILED · Showing saved data · ${label}`;
    } else {
      $("status").textContent = `BOM · ${label}`;
    }
  }

  async function loadWeather() {
    if (loading) return;

    if (!navigator.onLine) {
      updateStatus();
      return;
    }

    loading = true;
    $("refreshButton").disabled = true;

    $("status").textContent = lastUpdated
      ? "Checking BOM for new observations..."
      : "Loading BOM observations...";

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 20000);

    try {
      const response = await fetch(BOM_URL, {
        cache: "no-store",
        signal: controller.signal
      });

      if (!response.ok) {
        throw new Error(`BOM returned HTTP ${response.status}`);
      }

      const json = await response.json();
      const observations = json?.observations?.data;
      const observation = observations?.[0];

      if (!observation || !valid(observation.air_temp)) {
        throw new Error("No valid station observation found.");
      }

      // Do not replace valid data until the response is checked.
      lastObservation = observation;
      lastUpdated = Date.now();
      lastError = false;

      displayObservation(observation);

      saveCache({
        observation,
        savedAt: lastUpdated
      });

      updateStatus();

    } catch (error) {
      console.error("BOM weather error:", error);
      lastError = true;
      updateStatus();

      if (!lastObservation) {
        $("description").textContent =
          "Unable to retrieve BOM observations";
      }
    } finally {
      clearTimeout(timeout);
      loading = false;
      $("refreshButton").disabled = false;
    }
  }

  function startDashboard() {
    const cached = readCache();

    if (cached) {
      lastObservation = cached.observation;
      lastUpdated = cached.savedAt;

      displayObservation(lastObservation);
      updateStatus();
    }

    loadWeather();
  }

  $("refreshButton").addEventListener("click", loadWeather);

  window.addEventListener("online", loadWeather);
  window.addEventListener("offline", updateStatus);

  setInterval(loadWeather, REFRESH_INTERVAL);

  startDashboard();
</script>
</body>
</html>
