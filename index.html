
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>Pyrmont Weather</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #fff;
  color: #000;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  padding: 24px;
}

main {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  border-bottom: 3px solid #000;
  padding-bottom: 16px;
}

h1 {
  font-size: 30px;
  margin: 0;
}

#date {
  font-size: 14px;
  text-align: right;
}

.current {
  padding: 24px 0;
  border-bottom: 2px solid #000;
}

.label {
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

#temperature {
  margin: 16px 0;
  font-size: 110px;
  font-weight: bold;
  line-height: 1.1;
}

#description {
  font-size: 28px;
  font-weight: bold;
}

#feels {
  margin-top: 12px;
  font-size: 18px;
}

.details {
  display: flex;
  flex-wrap: wrap;
  padding: 24px 0;
  border-bottom: 2px solid #000;
}

.details > div {
  width: 33.333%;
  padding-right: 12px;
  margin-bottom: 12px;
}

.detail-label {
  margin-bottom: 10px;
  font-size: 13px;
  text-transform: uppercase;
}

.detail-value {
  font-size: 26px;
  font-weight: bold;
  word-wrap: break-word;
  overflow-wrap: anywhere;
}

footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  padding-top: 18px;
  font-size: 13px;
}

#status {
  line-height: 1.6;
  word-wrap: break-word;
  flex: 1;
  min-width: 180px;
}

button {
  flex-shrink: 0;
  min-height: 48px;
  padding: 12px 16px;
  border: 2px solid #000;
  border-radius: 0;
  background: #fff;
  color: #000;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
}

@media (max-width: 500px) {
  body {
    padding: 16px;
  }

  header {
    align-items: flex-start;
    flex-direction: column;
  }

  #date {
    text-align: left;
  }

  #temperature {
    font-size: 76px;
  }

  #description {
    font-size: 22px;
  }

  .details > div {
    width: 50%;
  }

  footer {
    align-items: flex-start;
    flex-direction: column;
  }

  button {
    width: 100%;
  }
}

@media (orientation: landscape) and (min-width: 600px) {
  body {
    padding: 20px 28px;
  }

  main {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
  }

  header, footer {
    width: 100%;
  }

  header {
    margin-bottom: 0;
  }

  .current {
    width: 57%;
    border-bottom: 0;
    border-right: 2px solid #000;
    padding-right: 24px;
  }

  .details {
    width: 40%;
    align-content: flex-start;
    border-bottom: 0;
  }

  .details > div {
    width: 100%;
  }
}
</style>
</head>

<body>

<main>

<header>
  <h1>Pyrmont Weather</h1>
  <div id="date">Weather report</div>
</header>

<section class="current">
  <div class="label">Current temperature</div>
  <div id="temperature">--°C</div>
  <div id="description">Loading weather...</div>
  <div id="feels">Feels like --°C</div>
</section>

<section class="details">

  <div>
    <div class="detail-label">Humidity</div>
    <div class="detail-value" id="humidity">--%</div>
  </div>

  <div>
    <div class="detail-label">Wind speed</div>
    <div class="detail-value" id="wind">-- km/h</div>
  </div>

  <div>
    <div class="detail-label">Rain (last hour)</div>
    <div class="detail-value" id="rain">-- mm</div>
  </div>

</section>

<footer>
  <div id="status" role="status">
    Starting weather dashboard...
  </div>

  <button id="refreshButton" type="button">
    Refresh weather
  </button>
</footer>

</main>

<script>

// ==========================================
// SETTINGS
// ==========================================

var CITY = "Pyrmont";
var LATITUDE = -33.8696;
var LONGITUDE = 151.1945;

var REFRESH_INTERVAL = 30 * 60 * 1000;
var CACHE_KEY = "pyrmont-weather-cache-v3";

// Replace with your OpenWeather API key.
var API_KEY = "d77655924cd10b1fb36c07181a9b49f4";

var WEATHER_URL =
  "https://api.openweathermap.org/data/2.5/weather";

var loading = false;
var lastUpdated = null;
var lastWeather = null;
var lastError = false;
var refreshTimer = null;

function $(id) {
  return document.getElementById(id);
}

// ==========================================
// HELPERS
// ==========================================

function numberWithUnit(value, unit) {
  if (value === null || value === undefined ||
      isNaN(Number(value))) {
    return "—";
  }

  return Math.round(Number(value)) + unit;
}

function formatTime(timestamp) {
  var date = new Date(timestamp);

  return date.toLocaleTimeString("en-AU", {
    hour: "2-digit",
    minute: "2-digit"
  });
}

function formatDate(timestamp, timezoneOffset) {
  if (!timestamp) {
    return "Date unavailable";
  }

  var date = new Date(
    (timestamp + timezoneOffset) * 1000
  );

  var weekdays = [
    "Sunday", "Monday", "Tuesday", "Wednesday",
    "Thursday", "Friday", "Saturday"
  ];

  var months = [
    "January", "February", "March", "April",
    "May", "June", "July", "August",
    "September", "October", "November", "December"
  ];

  return weekdays[date.getUTCDay()] + ", " +
    date.getUTCDate() + " " +
    months[date.getUTCMonth()];
}

function weatherDescription(description) {
  if (!description) {
    return "Conditions unavailable";
  }

  return description.charAt(0).toUpperCase() +
    description.substring(1);
}

// ==========================================
// CACHE
// ==========================================

function saveCache(data) {
  try {
    localStorage.setItem(
      CACHE_KEY,
      JSON.stringify(data)
    );
  } catch (error) {
    console.log("Could not save weather cache.");
  }
}

function readCache() {
  try {
    var saved = localStorage.getItem(CACHE_KEY);

    if (!saved) {
      return null;
    }

    var data = JSON.parse(saved);

    if (!data.weather ||
        !isFinite(data.updatedAt) ||
        data.updatedAt > new Date().getTime()) {
      return null;
    }

    return data;

  } catch (error) {
    console.log("Could not read weather cache.");
    return null;
  }
}

function cacheIsFresh() {
  if (!lastUpdated) {
    return false;
  }

  return (
    new Date().getTime() - lastUpdated <
    REFRESH_INTERVAL
  );
}

// ==========================================
// DISPLAY
// ==========================================

function displayWeather(weather) {

  $("date").textContent = formatDate(
    weather.timestamp,
    weather.timezoneOffset
  );

  $("temperature").textContent =
    numberWithUnit(weather.temperature, "°C");

  $("description").textContent =
    weather.description || "Conditions unavailable";

  $("feels").textContent =
    "Feels like " +
    numberWithUnit(weather.feelsLike, "°C");

  $("humidity").textContent =
    numberWithUnit(weather.humidity, "%");

  $("wind").textContent =
    numberWithUnit(weather.wind, " km/h");

  $("rain").textContent =
    weather.rain === null
      ? "—"
      : Number(weather.rain).toFixed(1) + " mm";
}

// ==========================================
// STATUS
// ==========================================

function updateStatus() {

  if (!lastUpdated) {
    $("status").textContent = lastError
      ? "Weather unavailable. Waiting to retry."
      : "Waiting for weather data.";

    return;
  }

  var age = new Date().getTime() - lastUpdated;
  var time = formatTime(lastUpdated);

  var freshness = age >= REFRESH_INTERVAL * 2
    ? "STALE DATA - Last updated"
    : "Last updated";

  if (!navigator.onLine) {

    $("status").textContent =
      "OFFLINE - " + freshness + " " + time;

  } else if (lastError) {

    $("status").textContent =
      "UPDATE FAILED - Showing saved weather - " +
      freshness + " " + time;

  } else {

    $("status").textContent =
      freshness + " " + time + " - OpenWeather";
  }
}

// ==========================================
// REFRESH SCHEDULING
// ==========================================

function scheduleRefresh() {

  if (refreshTimer) {
    clearTimeout(refreshTimer);
  }

  var delay = REFRESH_INTERVAL;

  if (lastUpdated) {
    var age = new Date().getTime() - lastUpdated;

    delay = Math.max(0, REFRESH_INTERVAL - age);
  }

  refreshTimer = setTimeout(function() {
    loadWeather(false);
  }, delay);
}

// ==========================================
// WEATHER REQUEST
// Uses XMLHttpRequest instead of fetch()
// ==========================================

function loadWeather(forceRefresh) {

  if (loading) {
    return;
  }

  if (!forceRefresh && cacheIsFresh()) {
    updateStatus();
    scheduleRefresh();
    return;
  }

  if (!navigator.onLine) {
    lastError = true;
    updateStatus();
    scheduleRefresh();
    return;
  }

  if (!API_KEY ||
      API_KEY === "YOUR_OPENWEATHER_API_KEY") {

    $("status").textContent =
      "Please add your OpenWeather API key.";

    return;
  }

  loading = true;

  $("refreshButton").disabled = true;

  $("status").textContent = lastUpdated
    ? "Checking for updated weather..."
    : "Downloading weather...";

  var xhr = new XMLHttpRequest();

  var url = WEATHER_URL +
    "?lat=" + encodeURIComponent(LATITUDE) +
    "&lon=" + encodeURIComponent(LONGITUDE) +
    "&appid=" + encodeURIComponent(API_KEY) +
    "&units=metric";

  xhr.open("GET", url, true);

  xhr.timeout = 20000;

  xhr.onreadystatechange = function() {

    if (xhr.readyState !== 4) {
      return;
    }

    loading = false;

    $("refreshButton").disabled = false;

    if (xhr.status === 200) {

      try {

        var data = JSON.parse(xhr.responseText);

        if (!data.main ||
            data.main.temp === null ||
            !data.weather ||
            !data.weather[0]) {

          throw new Error("Incomplete weather response");
        }

        var wind = null;

        if (data.wind &&
            data.wind.speed !== undefined) {

          wind = data.wind.speed * 3.6;
        }

        var rain = null;

        if (data.rain &&
            data.rain["1h"] !== undefined) {

          rain = data.rain["1h"];
        }

        var weather = {
          temperature: data.main.temp,
          feelsLike: data.main.feels_like,
          humidity: data.main.humidity,
          wind: wind,
          rain: rain,

          description: weatherDescription(
            data.weather[0].description
          ),

          timestamp: data.dt,
          timezoneOffset: data.timezone || 0
        };

        lastWeather = weather;
        lastUpdated = new Date().getTime();
        lastError = false;

        displayWeather(weather);

        saveCache({
          weather: weather,
          updatedAt: lastUpdated
        });

        updateStatus();

      } catch (error) {

        console.log("Weather data error:", error);

        lastError = true;
        updateStatus();
      }

    } else {

      console.log(
        "Weather request failed:",
        xhr.status,
        xhr.responseText
      );

      lastError = true;
      updateStatus();
    }

    scheduleRefresh();
  };

  xhr.onerror = function() {

    loading = false;
    $("refreshButton").disabled = false;

    lastError = true;
    updateStatus();

    scheduleRefresh();
  };

  xhr.ontimeout = function() {

    loading = false;
    $("refreshButton").disabled = false;

    lastError = true;
    updateStatus();

    scheduleRefresh();
  };

  try {

    xhr.send(null);

  } catch (error) {

    loading = false;
    $("refreshButton").disabled = false;

    lastError = true;
    updateStatus();

    scheduleRefresh();
  }
}

// ==========================================
// STARTUP
// ==========================================

function startDashboard() {

  var cached = readCache();

  if (cached) {

    lastWeather = cached.weather;
    lastUpdated = cached.updatedAt;

    displayWeather(lastWeather);
    updateStatus();
  }

  loadWeather(false);
}

// ==========================================
// BUTTON AND CONNECTIVITY EVENTS
// ==========================================

$("refreshButton").addEventListener(
  "click",
  function() {
    loadWeather(true);
  }
);

window.addEventListener("online", function() {
  loadWeather(false);
});

window.addEventListener("offline", function() {
  lastError = true;
  updateStatus();
});

startDashboard();

</script>

</body>
</html>
